<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulaire Message</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 th:text="${message.id == null ? 'Envoyer un message' : 'Modifier le message'}"></h1>
    <form th:action="${message.id == null ? '/messages' : '/messages/update/' + message.id}" th:object="${message}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">Nom :</label>
            <input type="text" th:field="*{senderName}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Email :</label>
            <input type="email" th:field="*{senderEmail}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Contact :</label>
            <input type="email" th:field="*{senderContact}" class="form-control" />
        </div>
        <div class="mb-3">
            <label class="form-label">Sujet :</label>
            <input type="text" th:field="*{subject}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Message :</label>
            <textarea th:field="*{content}" class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
</div>
</body>
</html>
