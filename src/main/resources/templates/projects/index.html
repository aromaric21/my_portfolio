<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mes Projects</title>
    <meta charset="UTF-8">

    <!-- Lien vers Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">Mes Projects</h1>

    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>

    <a th:href="@{/projects/new}" class="btn btn-success mb-3">Ajouter un projet</a>

    <div class="row g-4">
        <div class="col-md-4 col-sm-6" th:each="project : ${projects}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${project.title}"></h5>
                    <p class="card-text" th:text="${project.description}"></p>
                    <p class="card-text" th:text="${project.technologies}"></p>
                    <a th:href="${project.link}" target="_blank" class="btn btn-sm btn-outline-primary">Voir le projet</a>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/projects/edit/{id}(id=${project.id})}" class="btn btn-sm btn-primary">Modifier</a>
                    <a th:href="@{/projects/delete/{id}(id=${project.id})}" class="btn btn-sm btn-danger">Supprimer</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
</body>
</html>
