<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Projet</title>

    <!-- Lien vers Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 th:text="${project.id == null ? 'Ajouter' : 'Modifier'} + ' un projet'"></h1>
    <form th:action="${project.id == null ? '/projects' : '/projects/update/' + project.id}" th:object="${project}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">Titre :</label>
            <input type="text" th:field="*{title}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Description :</label>
            <textarea th:field="*{description}" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Lien :</label>
            <input type="url" th:field="*{link}" class="form-control" />
        </div>
        <div class="mb-3">
            <label class="form-label">Technologies :</label>
            <input type="text" th:field="*{technologies}" class="form-control" />
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
</div>

<!-- Script Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
