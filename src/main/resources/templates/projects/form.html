<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head">
    <title>Accueil</title>
</head>
<body>
<!-- Header -->
<div th:replace="layout :: header"></div>

<!-- Messages -->
<div th:replace="layout :: messages"></div>

<!-- Contenu spécifique -->
<div th:fragment="pageContent">
    <div class="container py-5">
        <h1 th:text="${project.id == null ? 'Ajouter' : 'Modifier'} + ' un projet'"></h1>
        <form th:action="${project.id == null ? '/projects' : '/projects/update/' + project.id}" th:object="${project}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label class="form-label">Titre :</label>
                <input type="text" th:field="*{title}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Description :</label>
                <textarea th:field="*{description}" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Lien :</label>
                <input type="url" th:field="*{link}" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Technologies :</label>
                <input type="text" th:field="*{technologies}" class="form-control" />
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="layout :: footer"></div>
</body>
</html>
